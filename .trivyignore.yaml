# trivy reads this over the built image, the filesystem and the images
# stack/compose.yml pins (pnpm check:all). A HIGH or CRITICAL finding fails
# the run unless it is listed here, and an entry is only for a finding that
# does not apply to this product or a real risk accepted for a stated reason,
# never for a finding in code we can fix by raising a version. Each entry
# names the finding, why, and the date to look again (expired_at, after which
# the finding fails again).
vulnerabilities:
  # Debian 13.7 packages of the node:24-trixie-slim and pgvector:pg18-trixie
  # bases. Debian has no fixed version for these (affected, or fix_deferred by
  # its security team) as of 2026-10-27, so raising the base digest fixes none.
  # Unless an entry says otherwise, the package is a tool the services do not
  # run: the api and worker start node alone as a non-root user, and the
  # postgres server does not call mount, login, gpg or perl at runtime.
