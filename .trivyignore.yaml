  # Go modules in the cerbos:0.57.0 binary. Cerbos 0.57.0 is its newest
  # release (checked 2026-11-07), so raising the pin fixes nothing yet.
  - id: CVE-2026-116587
    purls:
      - "pkg:golang/github.com/go-jose/go-jose/v4"
    statement: The flaw is in parsing a JWKS with RSA keys. Our Cerbos config
      (stack/cerbos/config.yaml, and the deployment's copy) sets no JWT or JWKS
      source, so Cerbos never parses one, and it sits on the internal app
      network, reachable by the api and worker alone. Raise the pin when a
      Cerbos release with go-jose 4.1.6 lands.
    expired_at: 2026-11-28
  - id: CVE-2026-78661
    purls:
      - "pkg:golang/golang.org/x/net"
    statement: The flaw is in golang.org/x/net/html, which the binary does not
      contain. Trivy reads the x/net 0.61.0 module from the build info, but Go
      links only the packages a program imports, and the binary's function names
      cover x/net's http2, hpack, trace, idna, dnsmessage, httpguts and
      httpproxy, never html (checked 2026-11-07). Cerbos serves its check API
      over HTTP on the internal app network, gRPC on loopback. Cerbos main still
      requires x/net 0.61.0 (checked 2026-11-07). Raise the pin when a Cerbos
      release with x/net 0.62.0 lands.
    expired_at: 2027-01-07
