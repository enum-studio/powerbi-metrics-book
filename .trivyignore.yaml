misconfigurations:
  # Railway has no bind mounts, so this image is the stock pgvector image with
  # the init script copied in (deploy/railway/postgres.Dockerfile). The stock
  # Postgres entrypoint starts as root only to set the owner of the data
  # volume, then runs the server as the postgres user. A USER line here would
  # stop it from preparing Railway's volume.
  - id: DS-0002
    paths:
      - "deploy/railway/postgres.Dockerfile"
    statement: The upstream Postgres entrypoint starts as root to prepare the volume and runs the server as postgres.
    expired_at: 2027-04-30
