  - id: CVE-2026-76844
    purls:
      - "pkg:deb/debian/zlib1g"
    statement: Fixed in Debian 13 as 1:1.3.dfsg+really1.3.1-1+deb13u1
      (DSA-6613-1, in trixie-security since 2026-11-02), but the pinned node and
      pgvector digests, each still the newest, ship 1:1.3.dfsg+really1.3.1-1+b1
      (checked 2026-11-07). Raise both digests when a rebuild carries it.
      Trivy's title names webpack-dev-middleware, but this is a zlib
      flaw. After a failed write, gz_write keeps a stale pointer to the caller's
      buffer. On Debian's zlib 1.3.1 that overflows if the program calls gzclearerr
      and writes again. Without gzclearerr later writes return an error, but gzclose
      still reads the pointer if writing works again by then, which can crash or
      copy freed memory into the output (tested 2026-11-05 on amd64 and arm64). No
      service or backup step reaches this. The postgres server imports no gz
      function, pg_dump's custom format and pg_restore from a pipe made no gz call
      when traced, and no program in these images calls gzclearerr. Node's own
      bundled zlib 1.3.2.1 has the flaw too and trivy does not see it. There a write
      that stalls on a non-blocking descriptor is enough, without gzclearerr.
      Nothing in node calls its gz functions, and the api image has no native addon
      that could. Raise the node pin when a 24.x release carries zlib commit df84af2.
    expired_at: 2026-12-05
