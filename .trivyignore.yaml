  - id: CVE-2026-85091
    purls:
      - "pkg:deb/debian/zlib1g"
    statement: Fixed in Debian 13 as 1:1.3.dfsg+really1.3.1-1+deb13u1
      (DSA-6613-1, in trixie-security since 2026-11-02, with CVE-2026-76844),
      but the pinned node and pgvector digests, each still the newest, ship
      1:1.3.dfsg+really1.3.1-1+b1 (checked 2026-11-07). The overflow needs a
      program to call gzprintf or gzvprintf after a write stalls. No program in
      these images calls either. A scan of every ELF file found the names only
      in libz itself and in node, whose bundled zlib 1.3.2.1 trivy does not see.
      Nothing in node calls its gz functions, and the api image has no native
      addon that could (no .node file, checked 2026-11-07). Raise both digests
      when a rebuild carries the fix, and the node pin when a 24.x release
      carries zlib commit df84af2.
    expired_at: 2026-12-05
