  - id: CVE-2026-109518
    purls:
      - "pkg:deb/debian/apt"
      - "pkg:deb/debian/libapt-pkg7.0"
    statement:
      Fixed in Debian as 3.0.4 (DSA-6607-1), and the node digest has it,
      but the newest pgvector image (built 2026-10-31, checked 2026-11-05) still
      ships 3.0.3. The flaw needs apt to install a package over tampered HTTP, and
      nothing runs apt in the postgres container or builds on it with apt. That
      alone protects root, since Azure's database-init job runs as root and on
      Railway the entry point starts as root. The server runs as user 999 on
      Compose and Railway, and user 999 cannot install. This entry would also hide
      the finding on an old node digest, because trivy cannot scope it to one
      image. Take the fix by raising the pgvector digest when a rebuild lands.
    expired_at: 2026-11-27
  - id: CVE-2026-119373
    purls:
      - "pkg:deb/debian/libsqlite3-0"
    statement: No fixed version in Debian 13 yet, marked no-dsa, minor issue
      (checked 2026-11-05). The flaw corrupts memory when SQLite runs crafted SQL
      or opens a crafted database file. Node and postgres with its extensions do
      not link this library. Only lslogins, through liblastlog2, and in the
      pgvector image gpg and keyboxd link it, and no service runs them or opens a
      SQLite file. So it takes a shell in the container already, where lslogins
      with a crafted file does crash (tested 2026-11-05). That gains nothing, since
      the crash runs with the shell's own rights and no setuid program links the
      library. Node's own bundled SQLite 3.53.4 has the same flaw and trivy does
      not see it, and nothing in the api loads node:sqlite. Raise the node pin
      when a 24.x release ships SQLite 3.54.
    expired_at: 2027-02-05
  - id: CVE-2026-119374
    purls:
      - "pkg:deb/debian/libsqlite3-0"
    statement: No fixed version in Debian 13 yet, marked no-dsa, minor issue
      (checked 2026-11-07). The flaw overflows the heap when SQLite deletes from
      a crafted FTS5 index with secure-delete on, so it needs a crafted database
      file. As for CVE-2026-119373, only lslogins and in the pgvector image gpg
      and keyboxd link the library, no service runs them or opens a SQLite file,
      and no setuid program or PAM module links it (checked again 2026-11-07).
      Node's own bundled SQLite 3.53.4 has the flaw too and trivy does not see
      it. The api opens no SQLite database. The auth adapter is drizzle on
      Postgres, and nothing creates undici's SQLite cache store. Raise the node
      pin when a 24.x release ships SQLite 3.54.
    expired_at: 2027-02-07
  - id: CVE-2026-119379
    purls:
      - "pkg:deb/debian/libsqlite3-0"
    statement: No fixed version in Debian 13 yet, marked no-dsa, minor issue
      (checked 2026-11-07). The flaw overflows the heap when
      sqlite3changeset_apply reads a crafted changeset. No program in these
      images calls it. A scan of every ELF file found the name only in
      libsqlite3 itself and in node, whose bundled SQLite 3.53.4 has the flaw
      too and trivy does not see it. Node offers it as applyChangeset in
      node:sqlite, and the api opens no SQLite database. The auth adapter is
      drizzle on Postgres, and nothing creates undici's SQLite cache store.
      Raise the node pin when a 24.x release ships SQLite 3.54.
    expired_at: 2027-02-07
