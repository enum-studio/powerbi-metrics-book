rules:
  - id: no-route-without-credential-check
    languages: [typescript]
    severity: ERROR
    message: >-
      This route has no credential check. Put `credential` ahead of the
      validators (routes/v1/adapter.ts), `credential(step)` as the setup routes
      do, or `browserOnly` or `sessionOnly` for a route only a signed-in
      browser reaches. A route
      is open to everyone only when its path is on the public list in
      apps/api/src/http/public-paths.ts, and then its handler checks whatever
      stands in for a credential.
    patterns:
      - pattern: $ROUTES.$METHOD($PATH, $FIRST, ...)
      - metavariable-regex:
          metavariable: $ROUTES
          regex: ^(routes|app|router)$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|all)$
      - pattern-not: $ROUTES.$METHOD($PATH, ..., credential, ...)
      - pattern-not: $ROUTES.$METHOD($PATH, ..., credential(...), ...)
      - pattern-not: $ROUTES.$METHOD($PATH, ..., browserOnly, ...)
      - pattern-not: $ROUTES.$METHOD($PATH, ..., sessionOnly, ...)
      # The public list's routes that live in a route module. GET only: the
      # list names the method, and a POST to the same path is not public.
      # public-paths_security_test.ts fails if the list and the routes disagree.
      - pattern-not: $ROUTES.get("/results/:id/csv", ...)
      - pattern-not: $ROUTES.get("/api/auth/config", ...)
      - pattern-not: $ROUTES.get("/api/branding/logo", ...)
      # Spends a setup link's token, which is its credential.
      - pattern-not: $ROUTES.post(`${SETUP_PATH}/session`, ...)
    paths:
      include:
        - "apps/api/src/routes/**"
      exclude:
        - "**/*.test.ts"
        - "**/*_security_test.ts"
        - "**/node_modules/**"
    metadata:
      spec: "docs/specs/2026-10-25-powerbi-metrics-book.md, Security: Checks that run and security tests"
