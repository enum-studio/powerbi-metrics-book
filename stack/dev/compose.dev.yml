# Layered over stack/compose.yml by pnpm dev:up, and by nothing else: the
# Power BI mock as the tenant, every Microsoft and embedding URL pointed at it,
# and the dev sign-in on. Nothing here is a password: pnpm dev:up writes
# throwaway ones to .env.local (gitignored) and passes it with --env-file.
# It derives the project name (-p), PBMB_PORT (api) and PBMB_MOCK_PORT (mock)
# from a hash of the checkout's path, so worktrees and parallel agents each run
# their own stack. The defaults serve a bare `docker compose` run only.
#
# The mock's origin is http://powerbi-mock.localhost:<PBMB_MOCK_PORT>, the same
# port inside and out. A browser resolves any *.localhost name to loopback and
# reaches the published port; the api and worker resolve the same name to the
# mock's alias on egress. One origin then serves the browser's sign-in
# redirect, the server's token call and the issuer in every token.

# Settings are read from the environment before the database, so these hold
# for the api and the worker alike. search.base_url has OpenAI's shape: pick
# OpenAI in the setup's search step. The guarded fetcher allows the mock's
# http origin only when NODE_ENV is development.
x-public-base-url: &public_base_url http://localhost:${PBMB_PORT:-3000}

x-development: &development
  NODE_ENV: development
  PUBLIC_BASE_URL: *public_base_url
  POWERBI_AUTHORITY: http://powerbi-mock.localhost:${PBMB_MOCK_PORT:-3001}
  POWERBI_API_URL: http://powerbi-mock.localhost:${PBMB_MOCK_PORT:-3001}/powerbi
  POWERBI_GRAPH_URL: http://powerbi-mock.localhost:${PBMB_MOCK_PORT:-3001}/graph
  EMAIL_BASE_URL: http://powerbi-mock.localhost:${PBMB_MOCK_PORT:-3001}
  SEARCH_BASE_URL: http://powerbi-mock.localhost:${PBMB_MOCK_PORT:-3001}/openai

x-needs-the-mock: &needs_the_mock
  powerbi-mock: { condition: service_healthy }

services:
  api:
    # Tagged per project, so one checkout's build never replaces the image
    # another checkout's stack is running.
    image: powerbi-metrics-book:${COMPOSE_PROJECT_NAME}
    environment:
      <<: *development
      # The dev sign-in opens only when this and NODE_ENV both say so.
      ALLOW_DEV_SIGN_IN: "1"
    depends_on: *needs_the_mock

  worker:
    image: powerbi-metrics-book:${COMPOSE_PROJECT_NAME}
    environment: *development
    depends_on: *needs_the_mock

  cerbos:
    volumes:
      # The repository's own policies, read from the checkout so a policy
      # change needs a restart, not an image build.
      - type: bind
        source: ../access/policies
        target: /policies/default
        read_only: true
        bind:
          create_host_path: false
      # The core has no deployment of its own, so this layer is empty.
      - type: tmpfs
        target: /policies/deployment
        tmpfs:
          size: 1m

  powerbi-mock:
    build:
      context: ..
      dockerfile: packages/powerbi-mock/Dockerfile
    image: powerbi-metrics-book-mock:${COMPOSE_PROJECT_NAME}
    user: "10001:10001"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp:size=16m]
    restart: unless-stopped
    # egress only: api and worker meet the real Microsoft there, and a port
    # can be published from it. On app the mock could reach postgres and
    # cerbos.
    networks:
      egress:
        aliases: [powerbi-mock.localhost]
    ports:
      - 127.0.0.1:${PBMB_MOCK_PORT:-3001}:${PBMB_MOCK_PORT:-3001}
    environment:
      PORT: ${PBMB_MOCK_PORT:-3001}
      MOCK_ORIGIN: http://powerbi-mock.localhost:${PBMB_MOCK_PORT:-3001}
      # The mock accepts only the api's own callbacks as redirect URIs.
      SAMPLE_PUBLIC_BASE_URL: *public_base_url
      # The test control route (/_mock/...), for Playwright and the end to
      # end test.
      MOCK_CONTROL: "1"
    healthcheck:
      # The sample tenant's signing keys: public, and served only once the
      # tenant is loaded.
      test:
        - CMD
        - node
        - -e
        - "fetch(`http://127.0.0.1:$${process.env.PORT}/11111111-1111-4111-8111-111111111111/discovery/v2.0/keys`).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy: { resources: { limits: { memory: 256m, cpus: "0.5" } } }

networks:
  # compose.yml pins edge to one range for TRUSTED_PROXY. A dev stack has no
  # proxy, and a second checkout's stack would fail on the same range.
  edge:
    ipam: !reset {}
