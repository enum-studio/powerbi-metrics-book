[project]
name = "powerbi-metrics-book-workspace"
version = "0"
requires-python = "==3.13.*"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/cli"]

[tool.uv.sources]
powerbi-metrics-book = { workspace = true }

[dependency-groups]
# ruff is a runtime dependency of powerbi-metrics-book, so the one pin is in
# apps/cli/pyproject.toml and the dev environment gets it through it.
dev = [
  "powerbi-metrics-book",
  "pytest==9.1.1",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
  "types-jsonschema==4.26.0.20261006",
]
