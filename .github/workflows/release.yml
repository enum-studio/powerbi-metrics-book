# A pushed tag `v*` releases: the image on GHCR (signed, with its SBOM), the
# CLI on PyPI, and a GitHub release with the pinned compose file. Why each
# choice is made, and what has to be set up before the first tag, is in
# docs/decisions/release.md.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# Never cancelled halfway: a run may already have pushed an image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/enum-studio/powerbi-metrics-book

jobs:
  check:
    name: Tag matches the versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release # the approval gate; every other job needs this one
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # apps/api/src/version.ts exports the "version" of apps/api/package.json,
      # so that field is what is compared.
      - id: versions
        name: Compare the tag with the CLI and the API
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib

          tag = os.environ["TAG"]
          cli = tomllib.load(open("apps/cli/pyproject.toml", "rb"))["project"]["version"]
          api = json.load(open("apps/api/package.json"))["version"]
          if not re.fullmatch(r"v[0-9A-Za-z.-]+", tag):
              sys.exit(f"The tag {tag} is not v followed by a version.")
          if tag != f"v{cli}" or tag != f"v{api}":
              sys.exit(f"Tag {tag}, CLI {cli} (pyproject.toml), API {api} (package.json): they must all agree.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={cli}\n")
          PY

  build_image:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: # no id-token: third-party build code runs here
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built under emulation. The emulator image is pinned by digest.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 # qemu-v10.2.3-68
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c # v0.34.0
          cache-binary: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only a 404 (no package yet) lets the build go on; --include shows the status.
      - name: Refuse a version that already has an image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if listed=$(gh api --include --paginate --jq '.[].metadata.container.tags[]' \
              /orgs/enum-studio/packages/container/powerbi-metrics-book/versions 2>&1); then
            if grep -qxF "$VERSION" <<< "$listed"; then
              echo "${IMAGE}:${VERSION} already exists. Bump the version instead."
              exit 1
            fi
          else
            case "$(sed -n 1p <<< "$listed")" in
              "HTTP/"*" 404 "*) ;;
              *) echo "Could not list the package's versions: $listed"; exit 1 ;;
            esac
          fi

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true

  sign_image:
    name: Sign the image
    needs: build_image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write # cosign's keyless signature
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest
        env:
          DIGEST: ${{ needs.build_image.outputs.digest }}
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Not a digest: $DIGEST"; exit 1; }
          printf '%s' "$REGISTRY_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify what was just signed
        env:
          DIGEST: ${{ needs.build_image.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$COMMIT" \
            --certificate-github-workflow-repository "$REPOSITORY" \
            --certificate-github-workflow-trigger push > /dev/null

  build_cli:
    name: Build the CLI around the pushed digest
    needs: [check, build_image, sign_image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.8
          enable-cache: false # a release never reads a cache an earlier run wrote

      # pbmb init pins a deployment to this digest; never committed.
      - name: Write the image digest into the package
        env:
          DIGEST: ${{ needs.build_image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Not a digest: $DIGEST"; exit 1; }
          echo "$DIGEST" > apps/cli/src/powerbi_metrics_book/assets/image.lock

      - name: Build the wheel and the source archive
        run: |
          uv build --package powerbi-metrics-book --out-dir dist \
            --build-constraints apps/cli/build-constraints.txt --require-hashes

      - name: Check the wheel carries the digest
        env:
          DIGEST: ${{ needs.build_image.outputs.digest }}
        run: |
          [ "$(unzip -p dist/*.whl powerbi_metrics_book/assets/image.lock)" = "$DIGEST" ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-dist
          path: dist/
          if-no-files-found: error

      # Made here, where nothing can be written, so the release job runs no
      # package code. Not installed (its build fetches an unhashed hatchling):
      # init.py reads no package metadata when imported.
      - name: Write the compose file pinned to the digest
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.check.outputs.version }}@${{ needs.build_image.outputs.digest }}
        run: |
          uv sync --locked --no-dev --no-install-project --package powerbi-metrics-book
          PYTHONPATH=apps/cli/src uv run --no-sync --package powerbi-metrics-book python -c '
          import os
          from powerbi_metrics_book.commands.init import compose_text
          print(compose_text(os.environ["IMAGE_REF"]), end="")
          ' > compose.yml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose
          path: compose.yml
          if-no-files-found: error

  publish_cli:
    name: CLI on PyPI
    needs: [build_image, build_cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: no PyPI token is stored.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-dist
          path: dist/

      - name: Check the wheel still carries the digest
        env:
          DIGEST: ${{ needs.build_image.outputs.digest }}
        run: |
          [ "$(unzip -p dist/*.whl powerbi_metrics_book/assets/image.lock)" = "$DIGEST" ]

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  release:
    name: GitHub release
    needs: [check, build_image, build_cli, publish_cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose
          path: .

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ needs.build_image.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          grep -qF "image: &image ${IMAGE}:${VERSION}@${DIGEST}" compose.yml
          cat > notes.md <<EOF
          Image: \`${IMAGE}@${DIGEST}\`

          \`compose.yml\` runs \`api\` and \`worker\` from that digest. Check the
          signature before you deploy it:

          \`\`\`
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity ${IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-github-workflow-sha ${COMMIT} \\
            --certificate-github-workflow-repository ${REPOSITORY} \\
            --certificate-github-workflow-trigger push
          \`\`\`

          The SBOM and the provenance are inside the image index, which the
          signature covers. The CLI is on PyPI: \`pip install powerbi-metrics-book\`.
          EOF
          gh release create "$TAG" compose.yml --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md --verify-tag
