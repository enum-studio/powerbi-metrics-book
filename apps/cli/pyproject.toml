[project]
name = "powerbi-metrics-book"
version = "0.1.1"
description = "Connect AI agents to an existing Power BI setup through a metrics book: metrics, variants, terms and documented datasets, over MCP, a CLI and an API."
readme = "README.md"
requires-python = "==3.13.*"
license = "Apache-2.0"
dependencies = [
  "typer==0.27.3",
  "httpx==0.28.1",
  "rich==15.0.0",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  # Exact pin: a new lint rule is a reviewed change.
  "ruff==0.17.2",
]

[project.scripts]
pbmb = "powerbi_metrics_book.cli:app"

[project.urls]
Homepage = "https://powerbimetricsbook.io"
Documentation = "https://powerbimetricsbook.io/docs/"
Repository = "https://github.com/enum-studio/powerbi-metrics-book"
Issues = "https://github.com/enum-studio/powerbi-metrics-book/issues"
Changelog = "https://github.com/enum-studio/powerbi-metrics-book/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbi_metrics_book"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "docker: runs a container; needs Docker. The default run includes it.",
]
